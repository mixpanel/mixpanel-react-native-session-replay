buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['MixpanelReactNativeSessionReplay_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["MixpanelReactNativeSessionReplay_" + name]).toInteger()
}

android {
  namespace "com.mixpanelreactnativesessionreplay"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
  // Last, so it only supplies what the remote repositories don't have. Wireframe support
  // landed in the Session Replay SDK before it was published, and the SDK repo's
  // `publishToMavenLocal` is how you build against it in the meantime.
  mavenLocal()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  
  // Mixpanel Android SDK dependency (minimum v8.0.2)
  implementation "com.mixpanel.android:mixpanel-android:8.0.2"
  
  // Mixpanel Android Session Replay SDK dependency.
  //
  // RELEASE: this is the pre-release build that carries wireframe support
  // (`MPSessionReplayConfig.wireframesOptions`, `View.mpWireframeText`). Bump it to the
  // released version before publishing this package — wireframes are the reason for the
  // pin, and the module will not compile against 1.4.0.
  implementation "com.mixpanel.android:mixpanel-android-session-replay:1.4.0-wire15"
}

react {
  jsRootDir = file("../src/")
  libraryName = "MixpanelReactNativeSessionReplay"
  codegenJavaPackageName = "com.mixpanelreactnativesessionreplay"
}
